[package]
name = "macroni"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = "0.12.1"
axum = "0.7.5"
env_logger = "0.11.3"
log = "0.4.22"
rusqlite = { version = "0.31.0" }
serde = { version = "1.0.204", features = ["derive"] }
time = { version = "0.3.36", features = ["local-offset"] }
tokio = { version = "1.38.0", features = ["full"] }
tower-http = { version = "0.5.0", features = ["fs"] }
